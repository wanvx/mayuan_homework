<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 </title>
  <meta name="description" content="关于我">
  <meta name="theme-color" content="#111111">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/css/blog.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">
        <span class="logo-mark">★</span>博客
      </div>
      <a class="back-btn" href="index.html">← 返回主页</a>
    </div>
  </header>

  <main class="container">

    <article class="profile-card">

      <!-- ============================================================
           圆形头像占位：请把你的头像图片放到 assets/ 目录下（例如 avatar.jpg），
           然后将下方占位 div 整体替换为：
           <img class="avatar" src="assets/avatar.jpg" alt="我的头像">
           ============================================================ -->
      <div class="avatar" role="img" aria-label="头像占位">
        <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
          <circle cx="24" cy="17" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M8 42c0-9 7-15 16-15s16 6 16 15" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span class="avatar-hint">头像</span>
      </div>

      <h1 class="profile-name">曦C</h1>
      <p class="profile-role">没钱卖服务器！！！！</p>

      <div class="divider"></div>

      <div class="profile-intro">
        <!-- 自我介绍占位：请在这里填入你的自我介绍文本，可直接替换下面括号内的内容 -->
        <p>等我后面买服务器吧。。。</p>
      </div>

    </article>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>假博客网站</p>
    </div>
  </footer>

</body>
</html>

</body>
</html>
